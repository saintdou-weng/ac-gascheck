<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>資產管理 · VRT</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<style>
:root{
  --p:#2563eb;--ph:#1d4ed8;--pl:#eff6ff;--pll:#dbeafe;
  --s:#16a34a;--sl:#f0fdf4;--sd:#14532d;
  --w:#d97706;--wl:#fffbeb;
  --r:#dc2626;--rl:#fef2f2;
  --bg:#f0f4f8;--white:#fff;
  --bdr:#d0dce8;--bdd:#b0c4d8;
  --tx:#1a2a3a;--tx2:#4a6a7a;--tx3:#8aaabb;
  --gbg:#f8fafc;
  --sh:0 1px 3px rgba(0,0,0,.10);
  --shm:0 4px 14px rgba(0,0,0,.12);
  --shx:0 20px 50px rgba(0,0,0,.18);
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--tx);font-family:'Noto Sans TC','Segoe UI','Microsoft JhengHei',sans-serif;min-height:100vh;font-size:14px}


/* TOP BAR */
.topbar{background:#fff;border-bottom:2px solid var(--p);height:50px;padding:0 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:200;box-shadow:var(--sh)}
.tb-left{display:flex;align-items:center;gap:10px}
.tb-badge{background:var(--p);color:#fff;font-weight:900;font-size:12px;padding:3px 9px;border-radius:6px;letter-spacing:1px}
.tb-title{font-weight:700;font-size:13px;color:var(--tx)}
.tb-right{display:flex;align-items:center;gap:7px}
.user-pill{display:flex;align-items:center;gap:5px;background:var(--gbg);border:1px solid var(--bdr);border-radius:20px;padding:3px 10px;font-size:12px;font-weight:600}
.udot{width:8px;height:8px;border-radius:50%}
.ude{background:#3b82f6}.udv{background:#f59e0b}.uda{background:#dc2626}
.sync-badge{font-size:10px;color:var(--tx3);display:flex;align-items:center;gap:3px}
.sdot{width:7px;height:7px;border-radius:50%;background:#94a3b8}
.sdot.ok{background:#22c55e}.sdot.err{background:#ef4444}.sdot.spin{background:#f59e0b;animation:spin 1s infinite}
@keyframes spin{0%,100%{opacity:1}50%{opacity:.3}}
.btn-sm{background:var(--gbg);border:1px solid var(--bdr);border-radius:7px;padding:4px 9px;cursor:pointer;font-size:11px;color:var(--tx2);font-weight:500;white-space:nowrap}
.btn-sm:hover{background:var(--pl);color:var(--p);border-color:var(--p)}
.lang-sw{display:flex;background:#e8eef5;border-radius:16px;padding:2px;gap:2px}
.lsw-btn{padding:3px 10px;border-radius:14px;border:none;cursor:pointer;font-size:11px;font-weight:700;background:transparent;color:var(--tx3)}
.lsw-btn.on{background:var(--p);color:#fff}

/* ZONE TABS */
.znav{background:#fff;border-bottom:1px solid var(--bdr);padding:0 16px;display:flex;overflow-x:auto;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.ztab{padding:9px 14px;border:none;background:none;font-size:13px;font-weight:600;color:var(--tx3);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.ztab.on{color:var(--p);border-bottom-color:var(--p)}
.zcnt{background:#e8eef5;color:var(--tx2);font-size:10px;font-weight:700;padding:1px 6px;border-radius:10px;margin-left:4px}
.ztab.on .zcnt{background:var(--pl);color:var(--p)}

/* BANNERS */
.banner{margin:12px 16px 0;border-radius:10px;padding:9px 14px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;border:1.5px solid}
.bv{background:#fef9c3;border-color:#fde047}.bv:hover{background:#fef08a}
.ba{background:#fee2e2;border-color:#fca5a5;margin-top:6px}.ba:hover{background:#fecaca}

/* MAIN */
.main{padding:14px 16px;max-width:1200px;margin:0 auto}

/* STATS */
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:14px}
.sc{background:#fff;border:1px solid var(--bdr);border-radius:10px;padding:11px 13px;display:flex;align-items:center;gap:10px;box-shadow:var(--sh)}
.sc-i{font-size:22px}.sc-l{font-size:10px;color:var(--tx3);font-weight:600;text-transform:uppercase;letter-spacing:.5px}.sc-v{font-size:19px;font-weight:800;line-height:1.1}

/* TOOLBAR */
.toolbar{background:#fff;border:1px solid var(--bdr);border-radius:10px;padding:10px 14px;margin-bottom:12px;display:flex;gap:7px;flex-wrap:wrap;align-items:center;box-shadow:var(--sh)}
.srch{flex:1;min-width:160px;background:var(--gbg);border:1.5px solid var(--bdr);border-radius:8px;padding:7px 11px;font-size:13px;color:var(--tx);outline:none;font-family:inherit}
.srch:focus{border-color:var(--p);background:#fff}
.fsel{background:#fff;border:1.5px solid var(--bdd);border-radius:8px;padding:7px 9px;font-size:12px;color:var(--tx2);outline:none;cursor:pointer;font-family:inherit}
.cnt{font-size:12px;color:var(--tx3);white-space:nowrap}.cnt b{color:var(--p);font-weight:700}
.btn-add{background:var(--p);color:#fff;border:none;border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:700;font-size:13px;white-space:nowrap}
.btn-add:hover{background:var(--ph)}

/* TABLE */
.twrap{background:#fff;border:1px solid var(--bdr);border-radius:10px;overflow:hidden;box-shadow:var(--sh)}
.tbl{width:100%;border-collapse:collapse}
.tbl th{padding:8px 10px;background:var(--gbg);text-align:left;font-size:10px;font-weight:700;color:var(--tx3);text-transform:uppercase;letter-spacing:.7px;border-bottom:1.5px solid var(--bdr);white-space:nowrap;cursor:pointer;user-select:none}
.tbl th:hover{background:var(--pl);color:var(--p)}
.tbl td{padding:7px 10px;border-bottom:1px solid var(--bdr);font-size:12px;vertical-align:middle}
.tbl tr:last-child td{border-bottom:none}
.tbl tr:hover td{background:#f0f5fb}
.tc{font-family:'IBM Plex Mono','Courier New',monospace;font-weight:700;font-size:12px;color:var(--p)}
.tn{font-weight:600;color:var(--tx)}.tm{color:var(--tx2)}.ts{font-size:10px;color:var(--tx3)}
.pcell{width:38px;height:38px;border-radius:7px;object-fit:cover;border:1px solid var(--bdr);cursor:zoom-in}
.pcell-e{width:38px;height:38px;border-radius:7px;background:var(--gbg);border:1.5px dashed var(--bdd);display:flex;align-items:center;justify-content:center;color:var(--tx3);font-size:14px}

/* BADGES */
.bdg{display:inline-block;padding:2px 8px;border-radius:12px;font-size:10px;font-weight:700;white-space:nowrap}
.b-act{background:#dcfce7;color:#15803d}.b-std{background:#dbeafe;color:#1d4ed8}
.b-rep{background:#fef9c3;color:#a16207}.b-dis{background:#fee2e2;color:#991b1b}
.b-len{background:#f3e8ff;color:#6d28d9}
.b-fac{background:#e0f2fe;color:#0369a1}.b-exp{background:#f3e8ff;color:#5b21b6}.b-loc{background:#dcfce7;color:#065f46}

/* TABLE ACTION BUTTONS */
.tactn{display:flex;gap:3px}
.bx{padding:3px 7px;border-radius:5px;border:1px solid;font-size:10px;cursor:pointer;font-weight:600;white-space:nowrap}
.bx-v{background:var(--gbg);border-color:var(--bdr);color:var(--tx2)}.bx-v:hover{background:var(--pl);border-color:var(--p);color:var(--p)}
.bx-e{background:#f0fdf4;border-color:#86efac;color:#15803d}
.bx-t{background:#fffbeb;border-color:#fcd34d;color:#b45309}
.bx-d{background:#fef2f2;border-color:#fca5a5;color:#dc2626}

/* MOBILE CARDS */
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:10px}
.acard{background:#fff;border:1px solid var(--bdr);border-radius:12px;overflow:hidden;box-shadow:var(--sh)}
.cp{height:110px;background:var(--gbg);display:flex;align-items:center;justify-content:center;font-size:34px;color:var(--tx3);overflow:hidden}
.cp img{width:100%;height:100%;object-fit:cover;cursor:zoom-in}
.cbody{padding:10px 12px}
.ccr{display:flex;justify-content:space-between;align-items:center;margin-bottom:3px}
.ccode{font-family:monospace;font-weight:800;color:var(--p);font-size:12px}
.cname{font-weight:700;font-size:13px;margin-bottom:6px}
.cmeta{display:grid;grid-template-columns:1fr 1fr;gap:2px 7px;font-size:11px;color:var(--tx2);margin-bottom:8px}
.cact{display:flex;flex-wrap:wrap;gap:6px;padding:8px 12px;border-top:1px solid var(--bdr);background:var(--gbg)}
.cact .bx{flex:1 1 28%;text-align:center;padding:6px 6px}

/* OVERLAY / MODAL */
.ovl{position:fixed;inset:0;background:rgba(15,23,42,.5);backdrop-filter:blur(4px);z-index:999;display:flex;align-items:center;justify-content:center;padding:14px}
.mdl{background:#fff;border-radius:16px;width:100%;max-width:720px;max-height:95vh;overflow:auto;box-shadow:var(--shx)}
.mdl-sm{max-width:500px}
.mhead{padding:14px 20px;border-bottom:1px solid var(--bdr);display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:#fff;z-index:1;border-radius:16px 16px 0 0}
.mtitle{font-weight:700;font-size:15px}.msub{font-size:11px;color:var(--tx3);margin-top:1px}
.mcls{width:27px;height:27px;background:var(--gbg);border:none;border-radius:50%;cursor:pointer;font-size:13px;color:var(--tx2);display:flex;align-items:center;justify-content:center}
.mcls:hover{background:var(--bdr)}
.mbody{padding:18px 20px}
.mfoot{padding:12px 20px;border-top:1px solid var(--bdr);display:flex;justify-content:flex-end;gap:8px;background:var(--gbg);border-radius:0 0 16px 16px;flex-wrap:wrap}

/* FORM */
.fsect{margin-bottom:16px}
.fsect-t{font-size:10px;font-weight:700;color:var(--tx3);text-transform:uppercase;letter-spacing:1px;margin-bottom:9px;padding-bottom:4px;border-bottom:1px solid var(--bdr)}
.fg2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.fg4{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:0 10px}
.fld{margin-bottom:11px}
.fld label{display:block;font-size:10px;font-weight:700;color:var(--tx2);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px}
.req{color:var(--r)}
.fld input,.fld select,.fld textarea{width:100%;background:var(--gbg);border:1.5px solid var(--bdr);border-radius:7px;padding:7px 10px;color:var(--tx);font-size:13px;outline:none;font-family:inherit;transition:border .15s}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--p);background:#fff}
.fld textarea{resize:vertical;min-height:58px}
.dup-warn{background:#fef9c3;border:1px solid #fde047;border-radius:6px;padding:6px 10px;font-size:11px;color:#713f12;margin-top:4px;display:none}

/* CODE PREVIEW */
.cprev{background:var(--pl);border:2px solid var(--p);border-radius:10px;padding:9px 16px;text-align:center;margin-bottom:16px}
.cprev-lbl{font-size:10px;color:var(--tx3);font-weight:700;text-transform:uppercase;margin-bottom:3px}
.cprev-val{font-family:'IBM Plex Mono','Courier New',monospace;font-size:22px;font-weight:900;color:var(--p);letter-spacing:3px}

/* PHOTO UPLOAD */
.pup{border:2px dashed var(--bdd);border-radius:10px;cursor:pointer;background:var(--gbg);overflow:hidden;min-height:80px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:5px;text-align:center;padding:10px;transition:all .2s}
.pup:hover{border-color:var(--p);background:var(--pl)}
.pup.has{border-style:solid;border-color:var(--p);padding:0}
.pup img{width:100%;max-height:170px;object-fit:contain}

/* DETAIL */
.dcode{font-family:monospace;font-size:22px;font-weight:900;color:var(--p);text-align:center;letter-spacing:3px;background:var(--pl);border-radius:10px;padding:11px;margin-bottom:13px;border:2px solid var(--p)}
.dphoto{width:100%;max-height:200px;object-fit:contain;border-radius:10px;margin-bottom:13px;border:1px solid var(--bdr);background:var(--gbg);cursor:zoom-in}
.dgrid{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:13px}
.di{background:var(--gbg);border-radius:8px;padding:8px 10px}.di.full{grid-column:span 2}
.di-l{font-size:9px;font-weight:700;color:var(--tx3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:2px}
.di-v{font-size:13px;color:var(--tx);font-weight:500}
.sts-chips{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:13px}
.sts-chip{padding:5px 13px;border-radius:16px;border:1.5px solid;font-size:11px;font-weight:700;cursor:pointer}

/* HISTORY LOG */
.hlog{display:flex;flex-direction:column;gap:5px;max-height:190px;overflow-y:auto}
.hitem{border-left:3px solid;padding:5px 9px;background:var(--gbg);border-radius:0 7px 7px 0}
.hitem.created{border-color:#22c55e}.hitem.edit{border-color:#3b82f6}
.hitem.pending{border-color:#eab308}.hitem.verified{border-color:#f97316}
.hitem.approved{border-color:#22c55e}.hitem.rejected{border-color:#ef4444}
.h-d{font-size:10px;color:var(--tx3);margin-bottom:1px}.h-t{font-size:11px;color:var(--tx2)}

/* APPROVAL FLOW */
.flow{display:flex;align-items:center;background:var(--gbg);border-radius:10px;padding:10px 13px;margin-bottom:13px}
.fstep{display:flex;align-items:center;gap:5px;flex:1}
.fdot{width:26px;height:26px;border-radius:50%;border:2px solid;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;flex-shrink:0}
.fd-done{background:#22c55e;border-color:#22c55e;color:#fff}
.fd-act{background:#f59e0b;border-color:#f59e0b;color:#fff;animation:spin 1.5s infinite}
.fd-idle{background:#e2e8f0;border-color:#e2e8f0;color:#94a3b8}
.fline{height:2px;flex:1;background:var(--bdr)}.fline.done{background:#22c55e}
.finfo{font-size:11px;color:var(--tx2)}.fname{font-size:9px;color:var(--tx3)}

/* PEOPLE ROW in request modal */
.people-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;margin-bottom:13px}
.pcard{background:var(--gbg);border-radius:8px;padding:8px 10px;border:1px solid var(--bdr)}
.pcard-role{font-size:9px;font-weight:700;color:var(--tx3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:3px}
.pcard-name{font-size:12px;font-weight:700}
.pcard-date{font-size:10px;color:var(--tx3)}

/* REQ CARD */
.rcard{background:#fff;border:1.5px solid var(--bdr);border-radius:10px;padding:12px;margin-bottom:9px}
.rcard.rt{border-left:4px solid var(--w)}.rcard.rd{border-left:4px solid var(--r)}
.rhead{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:7px}
.rmeta{font-size:11px;color:var(--tx2);margin-bottom:9px;line-height:1.7}
.rbtns{display:flex;gap:7px}

/* BUTTONS */
.btn-pri{background:var(--p);color:#fff;border:none;border-radius:8px;padding:8px 18px;cursor:pointer;font-weight:700;font-size:13px;font-family:inherit}
.btn-pri:hover{background:var(--ph)}
.btn-sec{background:#fff;border:1.5px solid var(--bdd);color:var(--tx2);border-radius:8px;padding:8px 14px;cursor:pointer;font-size:13px;font-family:inherit}
.btn-sec:hover{border-color:var(--p);color:var(--p)}
.btn-ok{background:var(--s);color:#fff;border:none;border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:700;font-size:13px;font-family:inherit}
.btn-ok:hover{background:var(--sd)}
.btn-rej{background:var(--r);color:#fff;border:none;border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:700;font-size:13px;font-family:inherit}
.btn-del{background:#fff;border:1.5px solid #fca5a5;color:var(--r);border-radius:8px;padding:7px 12px;cursor:pointer;font-weight:600;font-size:12px;margin-right:auto;font-family:inherit}

/* LOADING */
.loading-wrap{display:flex;align-items:center;justify-content:center;padding:60px 20px;color:var(--tx3)}
.spinner{width:24px;height:24px;border:3px solid var(--bdr);border-top-color:var(--p);border-radius:50%;animation:rot .8s linear infinite;margin-right:10px}
@keyframes rot{to{transform:rotate(360deg)}}

/* TOAST */
.toast{position:fixed;top:12px;left:50%;right:auto;max-width:min(92vw,560px);background:var(--tx);color:#fff;padding:10px 16px;border-radius:10px;font-size:13px;font-weight:500;box-shadow:var(--shm);z-index:9999;transition:all .3s;opacity:0;transform:translate(-50%,-8px);pointer-events:none;font-family:inherit;white-space:pre-line}
.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto;cursor:pointer}
.toast.ok{background:#15803d}.toast.err{background:#dc2626}.toast.info{background:#1d4ed8}

/* INFO/WARN BOXES */
.info-box{background:var(--pl);border:1px solid var(--pll);border-radius:8px;padding:9px 12px;font-size:12px;color:#1e40af;margin-bottom:12px;line-height:1.7}
.warn-box{background:#fffbeb;border:1px solid #fde047;border-radius:8px;padding:9px 12px;font-size:12px;color:#713f12;margin-bottom:12px;line-height:1.7}

@media(max-width:768px){
  .twrap{display:none}.stats{grid-template-columns:repeat(2,1fr)}
  .fg2,.fg4{grid-template-columns:1fr}.role-grid{grid-template-columns:1fr}
  .main{min-width:0;overflow-x:hidden}.toolbar{flex-wrap:wrap}.toolbar .srch{flex:1 1 100%}.toolbar .fsel{flex:1 1 30%;min-width:0;min-height:44px}.toolbar .cnt{flex:1 1 100%;order:9}.toolbar .btn-add{flex:1 1 100%;order:-1;font-size:15px}
}
.btn-add,.btn-sm,.bx,.btn-pri,.btn-sec,.btn-ok,.btn-rej,.btn-del,.mcls,.lbl-opt,.btn-imp,.btn-dl,.btn-lbl,.btn-share,.ztab,.lsw-btn,.user-pill,.sts-chip{touch-action:manipulation;min-height:44px}
.mcls{min-width:44px}.lsw-btn{padding:3px 12px}
.bx{padding:6px 10px;font-size:12px}
@media(min-width:769px){.cgrid{display:none}}
.hidden{display:none!important}
.nodata{text-align:center;padding:50px 20px;color:var(--tx3)}

/* LABEL PRINT */
.lbl-opts{display:flex;gap:8px;margin-bottom:14px;align-items:center;flex-wrap:wrap}
.lbl-opt{padding:7px 16px;border:2px solid var(--bdr);border-radius:20px;cursor:pointer;font-size:13px;font-weight:700;background:var(--gbg);transition:all .2s}
.lbl-opt.on{border-color:var(--p);background:var(--pl);color:var(--p)}
.lbl-preview-area{background:var(--gbg);border:1.5px solid var(--bdr);border-radius:10px;padding:16px;display:flex;flex-wrap:wrap;gap:14px;justify-content:center;min-height:80px;max-height:420px;overflow-y:auto}
.lbl-img-wrap{background:#fff;border:1.5px solid var(--bdr);border-radius:8px;padding:6px;text-align:center;box-shadow:var(--sh)}
.lbl-img-wrap canvas{display:block;max-width:220px;height:auto;border:1px solid #e2e8f0}
.lbl-img-btns{display:flex;gap:4px;margin-top:5px;justify-content:center}
.lbl-img-btns button{font-size:10px;padding:2px 8px;border:1px solid var(--bdr);border-radius:5px;background:var(--gbg);cursor:pointer;color:var(--tx2)}
.lbl-img-btns button:hover{background:var(--pl);border-color:var(--p);color:var(--p)}
.lbl-batch-list{max-height:260px;overflow-y:auto;margin-bottom:12px;border:1px solid var(--bdr);border-radius:8px}
.lbl-batch-item{display:flex;align-items:center;gap:8px;padding:6px 10px;border-bottom:1px solid var(--bdr);font-size:12px}
.lbl-batch-item:last-child{border-bottom:none}
.lbl-batch-item:hover{background:var(--pl)}
.lbl-batch-item input[type=checkbox]{width:16px;height:16px;cursor:pointer;accent-color:var(--p)}
.lbl-batch-item .tc{min-width:65px}
.btn-print{background:linear-gradient(135deg,#1e3a5f,#2563eb);color:#fff;border:none;border-radius:8px;padding:9px 20px;cursor:pointer;font-weight:800;font-size:14px;font-family:inherit;display:flex;align-items:center;gap:6px}
.btn-print:hover{opacity:.9}
.btn-lbl{background:#7c3aed;color:#fff;border:none;border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:700;font-size:13px;white-space:nowrap;font-family:inherit}
.btn-lbl:hover{background:#6d28d9}
.btn-imp{background:var(--s);color:#fff;border:none;border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:700;font-size:13px;white-space:nowrap;font-family:inherit}
.btn-imp:hover{background:var(--sd)}
.btn-dl{background:#0369a1;color:#fff;border:none;border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:700;font-size:13px;white-space:nowrap;font-family:inherit}
.btn-dl:hover{background:#075985}

/* ── 本地時間戳（不用 toISOString，避免 UTC+7 時區偏移）── */
function _localTS(){const d=new Date();const p=n=>String(n).padStart(2,'0');
  return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes())+':'+p(d.getSeconds());}
function _localYMD(d){d=d?new Date(d):new Date();const p=n=>String(n).padStart(2,'0');
  return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate());}

// 日期（Excel 序號、Date、字串 → YYYY-MM-DD；日優先）
// ════════════════════════════════
function localParseDate(v){
  if(v==null||v==='')return'';
  const p=n=>String(n).padStart(2,'0');
  if(v instanceof Date)return isNaN(v)?'':v.getFullYear()+'-'+p(v.getMonth()+1)+'-'+p(v.getDate());
  if(typeof v==='number'&&isFinite(v)){if(v<1||v>2958465)return'';const ms=Math.round((Math.floor(v)-25569)*86400000),d=new Date(ms);return d.getUTCFullYear()+'-'+p(d.getUTCMonth()+1)+'-'+p(d.getUTCDate());}
  const s=String(v).trim();if(/^\d+(\.\d+)?$/.test(s)&&+s>20000&&+s<2958465)return localParseDate(+s);
  const ok=(y,m,d)=>{y=+y;m=+m;d=+d;if(y<100)y+=2000;if(m<1||m>12||d<1||d>31)return'';const dt=new Date(y,m-1,d);return dt.getMonth()===m-1?y+'-'+p(m)+'-'+p(d):'';};
  let m=s.match(/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})/);if(m)return ok(m[1],m[2],m[3]);
  m=s.match(/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{2,4})/);if(m){const a=+m[1],b=+m[2];if(b>12&&a<=12)return ok(m[3],a,b);return ok(m[3],b,a);}
  return'';
}
function parseDateAny(v){if(typeof GC!=='undefined'&&typeof GC.parseDate==='function'){const r=GC.parseDate(v);if(r)return r;}return localParseDate(v);}

}
/* 舊的完整下載路徑（保留作備援；一般開頁走 loadAssetCachedThenRefresh） */
async function loadFromGAS(){
  loadLocal();setSdot('spin');
  const local=assetCloudRecords();let d=null;
  try{
    if(typeof GC!=='undefined'&&GC.cloud){const got=await GC.cloud.download('asset',local,{idKey:'id',tsKey:'updatedAt',dateField:'purchaseDate',photoField:'photos'});d={ok:true,records:got.list||local};}
  }catch(e){d=null;}
  if(d&&d.ok&&Array.isArray(d.records)){
    const governed=window.ASSET_V29?ASSET_V29.cleanupMalformed(d.records,'invalid_asset_code'):{active:d.records.filter(a=>a&&!a._deleted),dead:d.records.filter(a=>a&&a._deleted),removed:0};
    if(window.ASSET_V29)ASSET_V29.setTombstones(governed.dead);
    assets=governed.active.map(a=>Object.assign({id:a.id||a.code,updatedAt:a.updatedAt||_localTS()},a));
    assets.forEach(a=>{const p=assetPhotoValue(a.photos);if(p&&a.code)photos[a.code]=p;});
    recomputeCounters();setSdot('ok');render();
  }else{setSdot('err');render();}
}
async function saveToGAS(){
  saveLocal();
  /* 新增／修改先在本機完成，交由共用工具列背景增量同步。 */
  if(typeof GC!=='undefined'&&GC.sync&&GC.sync.schedule){
    GC.sync.schedule('asset','record_change');
    return {ok:true,queued:true};
  }
  try{
    if(typeof GC!=='undefined'&&GC.cloud){const sent=await GC.cloud.upload('asset',assetCloudRecords(),{idKey:'id',tsKey:'updatedAt',dateField:'purchaseDate',photoField:'photos'});return sent&&sent.res?sent.res:{ok:true};}
  }catch(e){console.warn('smart asset push failed',e);}
  return null;
}

// 編號：同類型「現有＋已刪除墓碑」最大號 +1（雲端載入後重算）
// ════════════════════════════════
function maxCodeNum(t){
  let m=0;const scan=x=>{const c=String(x&&(x.code||x.id)||'').toUpperCase().replace(/\s+/g,'');const mm=c.match(/^(AOA|AHA)[-_]?(\d{1,})$/);if(mm&&mm[1]===t)m=Math.max(m,parseInt(mm[2],10)||0);};
  assets.forEach(scan);(window.ASSET_V29?ASSET_V29.tombstones():[]).forEach(scan);return m;
}
function recomputeCounters(){cnts={AOA:maxCodeNum('AOA')+1,AHA:maxCodeNum('AHA')+1};try{localStorage.setItem('vrt_c7',JSON.stringify(cnts));}catch(e){}return cnts;}
function genCode(t){
  recomputeCounters();let n=cnts[t]||1,code;
  const dead=new Set((window.ASSET_V29?ASSET_V29.tombstones():[]).map(x=>String(x.code||x.id)));
  do{code=t+String(n).padStart(3,'0');n++;}while(assets.some(a=>a.code===code)||dead.has(code));
  cnts[t]=n;try{localStorage.setItem('vrt_c7',JSON.stringify(cnts));}catch(e){}return code;
}

// HISTORY（存結構化資料；顯示時依語言產生文字）
// ════════════════════════════════
const HIST_TYPES={created:['✨','新增','Created','បានបង្កើត'],edit:['✏️','編輯','Edited','បានកែ'],pending:['✈️','申請','Request','សំណើ'],verified:['🔍','審查','Reviewed','បានពិនិត្យ'],approved:['✅','已核可','Approved','បានអនុម័ត'],rejected:['❌','已退件','Rejected','បានបដិសេធ'],deleted:['🗑','刪除','Deleted','បានលុប'],import_update:['📥','匯入更新','Import update','ធ្វើបច្ចុប្បន្នភាពពីការនាំចូល'],inventory:['📦','庫存','Inventory','ស្តុក'],telegram_summary:['✈️','Telegram 摘要','Telegram summary','សង្ខេប Telegram']};
function histTypeLabel(k){const t=HIST_TYPES[k];return t?t[0]+' '+L(t[1],t[2],t[3]):String(k||'');}
/* ── Telegram 核可（後端 capabilities 含 asset-approval 時啟用）──
   只有 Paul 在 Telegram 按 ✅／❌ 才算決定；後端寫回資產（位置／使用人或已報廢）並在 history 加
   {type:'approved'|'rejected', request:{id}}，同步回來後這裡顯示。待核狀態＝history 有 pending 但沒有同 id 的決定。 */
function assetApprovalReady(){return !!(typeof GC!=='undefined'&&GC.approvalTools&&GC.approvalTools.asset===true);}
function assetRequestDecision(reqId,asset){
  if(!reqId)return null;const list=asset?[asset]:assets;
  for(const a of list){const h=(a&&Array.isArray(a.history)?a.history:[]).find(x=>x&&(x.type==='approved'||x.type==='rejected')&&x.request&&String(x.request.id)===String(reqId));if(h)return h;}
  return null;
}
function assetOpenRequests(a){
  const hist=a&&Array.isArray(a.history)?a.history:[];
  return hist.filter(h=>h&&h.type==='pending'&&h.telegram==='sent'&&h.approval==='telegram'&&h.request&&h.request.id&&!assetRequestDecision(h.request.id,a));
}
if(typeof window!=='undefined'&&window.addEventListener)window.addEventListener('gc:capabilities',()=>{try{const rq=document.getElementById('m-req');if(rq&&!rq.classList.contains('hidden'))refreshReqTexts();const det=document.getElementById('m-det');if(det&&!det.classList.contains('hidden')&&viewCode)openDetail(viewCode);}catch(e){}});
function describeHistory(h){
  if(!h)return'';const who=h.actor||h.by||'';const by=who?' · 👤 '+who:'';
  switch(h.type){
    case'created':return L('建立資產','Asset created','បានបង្កើតទ្រព្យ')+(h.source?' · '+h.source:'')+by;
    case'edit':{if(h.statusTo)return L('狀態','Status','ស្ថានភាព')+' → '+stLabel(h.statusTo)+by;const b=h.before||{},a=h.after||{};const ch=Object.keys(a).filter(k=>String(b[k]==null?'':b[k])!==String(a[k]==null?'':a[k]));return L('已編輯','Edited','បានកែ')+(ch.length?' ('+ch.join(', ')+')':'')+by;}
    case'pending':{const r=h.request||{};const what=r.type==='transfer'?L('轉移申請','Transfer request','សំណើផ្ទេរ')+' → '+(r.newLocation||'—'):L('報廢申請','Disposal request','សំណើជម្រះចោល')+' · '+disposalLabel(r.disposalType);const st=h.telegram!=='sent'?L('未送出','Not sent','មិនទាន់ផ្ញើ'):h.approval==='telegram'?(assetRequestDecision(h.request&&h.request.id)?L('Paul 已決定','Decided by Paul','Paul បានសម្រេច'):L('等待 Paul 在 Telegram 核可','Waiting for Paul in Telegram','រង់ចាំ Paul អនុម័តក្នុង Telegram')):L('已通知 Telegram','Telegram notified','បានជូនដំណឹង Telegram');return what+(r.reason?' · '+r.reason:'')+' · '+st+by;}
    case'approved':case'rejected':{const r=h.request||{};const ok=h.type==='approved';let what=r.type==='transfer'?L('轉移申請','Transfer request','សំណើផ្ទេរ')+(r.newLocation?' → '+r.newLocation:'')+(r.newUser?' · 👤 '+r.newUser:''):r.type?L('報廢申請','Disposal request','សំណើជម្រះចោល')+(r.disposalType?' · '+disposalLabel(r.disposalType):''):'';const res=ok?L('Paul 已在 Telegram 核可','Approved by Paul in Telegram','Paul បានអនុម័តក្នុង Telegram'):L('Paul 已在 Telegram 退件','Rejected by Paul in Telegram','Paul បានបដិសេធក្នុង Telegram');return (what?what+' · ':'')+res+by;}
    case'telegram_summary':return L('已發送 Telegram 摘要','Telegram summary sent','បានផ្ញើសង្ខេប Telegram')+by;
    case'import_update':return L('Excel 匯入更新','Updated from Excel','ធ្វើបច្ចុប្បន្នភាពពី Excel')+(h.source?' · '+h.source:'')+by;
    case'inventory':return L('庫存異動','Stock movement','ចលនាស្តុក')+(h.source?' · '+h.source:'')+by;
    default:return (h.desc&&!/[㐀-鿿]/.test(h.desc)||lang==='zh')?String(h.desc||histTypeLabel(h.type))+by:histTypeLabel(h.type)+by;
  }
}

function handlePhoto(e){
  const f=e.target.files[0];if(!f)return;
  if(typeof GC!=='undefined'&&GC.photo&&GC.photo.compress){GC.photo.compress(f,1024,0.7).then(d=>{formPhoto=d;showPup(formPhoto);}).catch(()=>toast(L('照片讀取失敗','Photo could not be read','មិនអាចអានរូបថតបាន'),'err'));return;}
  const r=new FileReader();
  r.onload=ev=>{const img=new Image();img.onload=()=>{const c=document.createElement('canvas'),M=1024;let w=img.width,h=img.height;if(w>M||h>M){if(w>h){h=Math.round(h*M/w);w=M}else{w=Math.round(w*M/h);h=M}}c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);formPhoto=c.toDataURL('image/jpeg',.7);showPup(formPhoto);};img.src=ev.target.result;};
  r.readAsDataURL(f);
}
function showPup(data){
  const el=document.getElementById('pup');
  if(data){el.innerHTML=`<img src="${esc(data)}" alt="">`;el.classList.add('has');document.getElementById('pup-rm').classList.remove('hidden')}
  else{el.innerHTML=`<div style="font-size:26px">📷</div><div style="font-size:12px;color:var(--tx3)">${esc(tt('uploadHint'))}</div>`;el.classList.remove('has');document.getElementById('pup-rm').classList.add('hidden')}
}

function calcTV(){const q=parseFloat(document.getElementById('f-qt').value)||0,u=parseFloat(document.getElementById('f-up').value)||0;document.getElementById('f-tv').value=q&&u?'$'+numText(q*u,{minimumFractionDigits:2,maximumFractionDigits:2}):''}
function upCP(){if(editCode){document.getElementById('cp-val').textContent=editCode;return}recomputeCounters();const t=document.getElementById('f-ct').value||'AOA';document.getElementById('cp-val').textContent=t+String(cnts[t]).padStart(3,'0')}
function syncZoneCodeType(){

function checkDup(){
  const nm=document.getElementById('f-nm').value.trim().toLowerCase(),zn=document.getElementById('f-zn').value,w=document.getElementById('dup-w');
  if(!nm){w.style.display='none';return}
  const dup=assets.filter(a=>(!editCode||a.code!==editCode)&&String(a.name||'').toLowerCase()===nm&&a.zone===zn);
  if(dup.length){w.style.display='block';w.textContent='⚠️ '+L('此區域已有相同品名','Same name already exists in this zone','មានឈ្មោះដូចគ្នានៅតំបន់នេះរួចហើយ')+'：'+dup[0].code}else w.style.display='none';
}

async function _saveAsset(){
  const nm=document.getElementById('f-nm').value.trim();
  if(!nm)return flagField('f-nm',L('請填寫品名','Please enter the name','សូមបញ្ចូលឈ្មោះ'));
  const by=document.getElementById('f-by').value.trim();
  if(!by)return flagField('f-by',L('請填寫記錄人','Please enter who is recording','សូមបញ្ចូលអ្នកកត់ត្រា'));
  const qtyRaw=document.getElementById('f-qt').value,qty=parseInt(qtyRaw,10);
  if(!(qty>=1))return flagField('f-qt',L('數量至少為 1','Quantity must be at least 1','បរិមាណយ៉ាងហោចណាស់ 1'));
  const upRaw=document.getElementById('f-up').value,up=upRaw===''?0:parseFloat(upRaw);
  if(!(up>=0))return flagField('f-up',L('單價不可為負數','Unit price cannot be negative','តម្លៃមិនអាចអវិជ្ជមាន'));
  rememberActor(by);
  const data={zone:document.getElementById('f-zn').value,name:nm,category:document.getElementById('f-c2').value,status:document.getElementById('f-st2').value,brand:document.getElementById('f-br').value.trim(),model:document.getElementById('f-md').value.trim(),color:document.getElementById('f-cl').value.trim(),size:document.getElementById('f-sz').value.trim(),qty,unit:document.getElementById('f-un').value.trim()||'pcs',unitPrice:up,location:document.getElementById('f-lc').value.trim(),user:document.getElementById('f-us').value.trim(),purchaseDate:document.getElementById('f-dt').value,remark:document.getElementById('f-rm').value.trim()};
  const isNew=!editCode;
  if(editCode){
    const old=assets.find(x=>x.code===editCode);if(!old){cancelEdit(true);closeM('m-form');return toast(L('這筆資產已不存在（可能已被刪除）','This asset no longer exists (it may have been deleted)','ទ្រព្យនេះលែងមាន (ប្រហែលត្រូវបានលុប)'),'err');}
    data.code=editCode;data.id=old.id||editCode;data.createdAt=old.createdAt||old.purchaseDate||_localTS();data.recordedBy=old.recordedBy||by;data.lastEditedBy=by;data.updatedAt=_localTS();
    data.history=[...(old.history||[]),{type:'edit',date:_localTS(),actor:by,before:assetSnapshot(old),after:assetSnapshot(data)}];
    assets=assets.map(a=>a.code===editCode?Object.assign({},a,data):a);photos[editCode]=formPhoto||undefined;if(!formPhoto)delete photos[editCode];
  }else{
    const t=document.getElementById('f-ct').value,nc=genCode(t);
    data.code=nc;data.id=nc;data.createdAt=_localTS();data.updatedAt=data.createdAt;data.recordedBy=by;data.lastEditedBy=by;data.history=[{type:'created',date:data.createdAt,actor:by,after:assetSnapshot(data)}];
    assets=[data,...assets];if(formPhoto)photos[data.code]=formPhoto;
  }
  const code=data.code;editCode=null;document.getElementById('m-form').classList.add('hidden');document.getElementById('edit-banner').classList.add('hidden');
  render();
  await saveToGAS();
  toast(isNew?'✅ '+L('新增完成','Added','បានបន្ថែម')+': '+code:'✅ '+L('已更新','Updated','បានធ្វើបច្ចុប្បន្នភាព')+': '+code,'ok');
  return true;
}

  ];

  if(a.history?.length){

  }
  document.getElementById('m-db').innerHTML=html;

async function quickSt(code,k){
  const by=storedActor()||'—';

  render();openDetail(code);toast('→ '+stLabel(k),'ok');await saveToGAS();
}

async function _submitReq(){
  const a=assets.find(x=>x.code===viewCode);if(!a){closeM('m-req');return false;}
  const by=document.getElementById('req-by').value.trim();
  if(!by)return flagField('req-by',L('請填寫申請人','Please enter the requester','សូមបញ្ចូលអ្នកស្នើសុំ'));
  let data={};
  if(reqType==='transfer'){
    const loc=(document.getElementById('req-loc')?.value||'').trim();
    if(!loc)return flagField('req-loc',L('請填寫轉移位置','Please enter the new location','សូមបញ្ចូលទីតាំងថ្មី'));
    data={newLocation:loc,newUser:(document.getElementById('req-usr')?.value||'').trim(),date:document.getElementById('req-dt')?.value||''};
  }else{
    const dt=document.getElementById('req-distype')?.value;
    if(!dt)return flagField('req-distype',L('請選擇報廢原因類型','Please choose the disposal type','សូមជ្រើសប្រភេទជម្រះចោល'));
    data={disposalType:dt,date:document.getElementById('req-dt')?.value||''};
  }
  if(!data.date)return flagField('req-dt',L('請選擇日期','Please choose a date','សូមជ្រើសកាលបរិច្ឆេទ'));
  const reason=document.getElementById('req-reason').value.trim();
  if(!reason)return flagField('req-reason',L('請填寫原因','Please enter the reason','សូមបញ្ចូលមូលហេតុ'));
  rememberActor(by);
  const req={id:'areq_'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),type:reqType,assetCode:a.code,assetName:a.name||'',data,reason,by,date:today(),createdAt:_localTS()};
  if(typeof GC==='undefined'||!GC.telegram||!GC.telegram.send){toast(L('Telegram 功能尚未載入，請稍後再試','Telegram is not ready yet; please try again','Telegram មិនទាន់រួចរាល់ សូមព្យាយាមម្ដងទៀត'),'err');return false;}
  const approval=assetApprovalReady();
  if(approval)req.approval='telegram';
  toast(L('傳送中…','Sending…','កំពុងផ្ញើ…'),'info');
  let res;
  try{
    /* 核可模式：後端要在雲端找到這筆資產才能在 Paul 核可時更新 → 先確認已上傳。 */
    if(approval&&GC.sync&&GC.sync.upload){const up=await GC.sync.upload('asset',{silent:true,reason:'asset_request'});if(up&&up.ok===false&&!up.unmounted)throw new Error(String(up.error&&up.error.message||up.error||L('雲端上傳未完成','Cloud upload failed','ការផ្ទុកឡើង Cloud បរាជ័យ')));}
    const ph=assetPhotoValue(photos[a.code])||assetPhotoValue(a.photos);
    const meta={messageKey:'asset_request|'+req.id,reportLanguage:lang};
    if(approval)meta.assetRequest={id:req.id,type:req.type==='transfer'?'transfer':'disposal',assetCode:a.code,assetName:a.name||'',data:{newLocation:data.newLocation||'',newUser:data.newUser||'',disposalType:data.disposalType||'',date:data.date||''},reason:reason,by:by};
    res=await GC.telegram.send(buildRequestTelegram(req,a),ph?[ph]:[],[],undefined,'asset',meta);
  }catch(err){
    toast('❌ '+L('Telegram 未送出，申請未記錄；請檢查網路後再按一次','Telegram was not sent and the request was not recorded; check the connection and try again','Telegram មិនបានផ្ញើ ហើយសំណើមិនត្រូវបានកត់ត្រា; សូមពិនិត្យអ៊ីនធឺណិត ហើយព្យាយាមម្ដងទៀត')+' ('+(err&&err.message||err)+')','err');
    return false;
  }
  req.telegram='sent';req.messageId=res&&res.messageId!=null?res.messageId:'';
  pending=[req].concat((pending||[]).filter(p=>p&&p.id!==req.id)).slice(0,200);
  const now=_localTS();
  assets=assets.map(x=>x.code!==a.code?x:{...x,updatedAt:now,history:[...(x.history||[]),Object.assign({type:'pending',date:now,actor:by,telegram:'sent',request:{id:req.id,type:req.type,newLocation:data.newLocation||'',newUser:data.newUser||'',disposalType:data.disposalType||'',date:data.date,reason}},approval?{approval:'telegram'}:{})]});
  document.getElementById('m-req').classList.add('hidden');render();
  /* 核可模式：申請記錄立刻上雲（Paul 很快按下時，後端寫入的核可版本會包含這筆申請）。 */
  if(approval&&GC.sync&&GC.sync.upload){saveLocal();try{await GC.sync.upload('asset',{silent:true,reason:'asset_request'});}catch(e){await saveToGAS();}}
  else await saveToGAS();
  toast('✅ '+(approval?L('已送出，等待 Paul 在 Telegram 按核可；核可後資產自動更新','Sent; waiting for Paul to approve in Telegram. The asset updates automatically after approval','បានផ្ញើ; រង់ចាំ Paul អនុម័តក្នុង Telegram។ ទ្រព្យនឹងធ្វើបច្ចុប្បន្នភាពដោយស្វ័យប្រវត្តិ'):L('已通知 Telegram 群組；Paul 決定後請編輯資產更新','Telegram group notified; update the asset after Paul decides','បានជូនដំណឹងក្រុម Telegram; សូមកែទ្រព្យក្រោយ Paul សម្រេច')),'ok');
  return true;
}

function setLblType(t){lblType=t;document.getElementById('lo-qr').classList.toggle('on',t==='qr');document.getElementById('lo-bc').classList.toggle('on',t==='barcode');renderLabelPreview();}

function renderBatchList(){

function toggleBatchItem(code,chk){if(chk)batchSelected.add(code);else batchSelected.delete(code);document.getElementById('batch-cnt').textContent=batchSelected.size;renderLabelPreview();}
function batchAll(on){
  const q=(document.getElementById('batch-q')?.value||'').toLowerCase();
  const list=assets.filter(a=>!q||[a.code,a.name,a.brand,a.location,a.user].some(v=>v&&String(v).toLowerCase().includes(q)));
  if(on)list.forEach(a=>batchSelected.add(a.code));else batchSelected.clear();
  renderBatchList();renderLabelPreview();

function makeQR(data){try{var qr=qrcode(0,'L');qr.addData(unescape(encodeURIComponent(data)));qr.make();return qr.createDataURL(4,1);}catch(e){console.error('QR gen error:',e);return null}}
function createLabelElement(code,type){
  const a=assets.find(x=>x.code===code);
  const name=a?.name||'',brand=a?.brand||'',loc=a?.location||'',user=a?.user||'';
  const wrap=document.createElement('div');wrap.className='lbl-img-wrap';
  const lbl=document.createElement('div');
  if(type==='qr'){
    lbl.style.cssText='background:#fff;border:2px solid #000;display:inline-flex;align-items:center;padding:8px 12px;gap:12px;height:90px';
    const dataUrl=makeQR(JSON.stringify({code,name,brand,location:loc,user,org:'VRT'}));
    if(dataUrl){const img=document.createElement('img');img.src=dataUrl;img.alt=code;img.style.cssText='width:74px;height:74px;flex-shrink:0;image-rendering:pixelated';lbl.appendChild(img);}
    const txt=document.createElement('div');txt.style.cssText='font-family:"Courier New",monospace;font-weight:900;font-size:26px;letter-spacing:2px;white-space:nowrap;color:#000';txt.textContent=code;lbl.appendChild(txt);
  }else{
    lbl.style.cssText='background:#fff;border:2px solid #000;display:flex;flex-direction:column;align-items:center;padding:6px 14px;gap:3px;height:90px;justify-content:center';
    const bcCanvas=document.createElement('canvas');
    try{JsBarcode(bcCanvas,code,{format:'CODE128',width:1.8,height:42,displayValue:false,margin:0,background:'#ffffff',lineColor:'#000000'});const img=document.createElement('img');img.src=bcCanvas.toDataURL();img.alt=code;img.style.cssText='height:42px;width:auto;display:block;max-width:240px';lbl.appendChild(img);}catch(e){}
    const txt=document.createElement('div');txt.style.cssText='font-family:"Courier New",monospace;font-weight:900;font-size:18px;letter-spacing:1px;white-space:nowrap;color:#000';txt.textContent=code;lbl.appendChild(txt);
  }
  wrap.appendChild(lbl);
  const btns=document.createElement('div');btns.className='lbl-img-btns';
  btns.innerHTML=`<button onclick="downloadOneLabel('${esc(code)}')">📥 ${esc(tt('downloadPng'))}</button><button onclick="shareOneLabel('${esc(code)}')">📲 ${esc(tt('share'))}</button>`;
  wrap.appendChild(btns);return wrap;
}
async function renderLabelPreview(){
  const area=document.getElementById('lbl-preview');area.innerHTML='';
  const codes=[...batchSelected];
  if(!codes.length){area.innerHTML=`<div style="color:var(--tx3);font-size:13px;padding:20px">${esc(L('請選擇要列印的資產','Select assets to print','ជ្រើសទ្រព្យដើម្បីបោះពុម្ព'))}</div>`;return;}
  codes.slice(0,20).forEach(code=>area.appendChild(createLabelElement(code,lblType)));
  if(codes.length>20){const m=document.createElement('div');m.style.cssText='font-size:12px;color:var(--tx3);width:100%;text-align:center;padding:8px';m.textContent='… +'+(codes.length-20);area.appendChild(m);}
}
function labelToCanvas(code,type){
  const a=assets.find(x=>x.code===code);
  const name=a?.name||'',brand=a?.brand||'',loc=a?.location||'',user=a?.user||'';
  const H=142,W=709,canvas=document.createElement('canvas');canvas.width=W;canvas.height=H;
  const ctx=canvas.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,W,H);ctx.strokeStyle='#000';ctx.lineWidth=2;ctx.strokeRect(1,1,W-2,H-2);
  const codeText=x=>{ctx.fillStyle='#000';ctx.font='bold 56px "Courier New",monospace';ctx.textBaseline='middle';ctx.fillText(code,x,H/2);ctx.textBaseline='alphabetic';};
  if(type==='qr'){
    const dataUrl=makeQR(JSON.stringify({code,name,brand,location:loc,user,org:'VRT'}));
    if(dataUrl)return new Promise(resolve=>{const img=new Image();img.onload=()=>{const sz=H-12;ctx.drawImage(img,6,6,sz,sz);codeText(sz+18);resolve(canvas);};img.onerror=()=>{codeText(20);resolve(canvas);};img.src=dataUrl;});
    codeText(20);return Promise.resolve(canvas);
  }
  const bcCanvas=document.createElement('canvas');
  try{JsBarcode(bcCanvas,code,{format:'CODE128',width:2,height:80,displayValue:false,margin:0,background:'#ffffff',lineColor:'#000000'});const bw=Math.min(bcCanvas.width,W-20),bh=Math.min(80,H-40);ctx.drawImage(bcCanvas,0,0,bcCanvas.width,bcCanvas.height,(W-bw)/2,4,bw,bh);}catch(e){}
  ctx.fillStyle='#000';ctx.font='bold 34px "Courier New",monospace';ctx.textAlign='center';ctx.fillText(code,W/2,H-12);ctx.textAlign='left';
  return Promise.resolve(canvas);
}
async function downloadOneLabel(code){const c=await labelToCanvas(code,lblType);const a=document.createElement('a');a.href=c.toDataURL('image/png');a.download=`label_${code}.png`;a.click();}
async function downloadAllLabels(){
  const codes=[...batchSelected];
  if(!codes.length){toast(L('請至少選擇一筆','Select at least one','សូមជ្រើសយ៉ាងហោចណាស់មួយ'),'err');return}
  for(let i=0;i<codes.length;i++){const c=await labelToCanvas(codes[i],lblType);const a=document.createElement('a');a.href=c.toDataURL('image/png');a.download=`label_${codes[i]}.png`;setTimeout(()=>a.click(),i*200);}
  toast('📥 '+codes.length+' '+L('個標籤已下載','labels downloaded','ស្លាកបានទាញយក'),'ok');
}
async function shareOneLabel(code){
  try{const c=await labelToCanvas(code,lblType);const blob=await new Promise(r=>c.toBlob(r,'image/png'));const file=new File([blob],`label_${code}.png`,{type:'image/png'});if(navigator.canShare?.({files:[file]}))await navigator.share({files:[file],title:`VRT ${code}`});else downloadOneLabel(code);}
  catch(e){if(e.name!=='AbortError')downloadOneLabel(code)}
}
async function shareLabels(){
  const codes=[...batchSelected];if(!codes.length)return;const files=[];
  for(const code of codes){const c=await labelToCanvas(code,lblType);const blob=await new Promise(r=>c.toBlob(r,'image/png'));files.push(new File([blob],`label_${code}.png`,{type:'image/png'}));}
  try{if(navigator.canShare?.({files}))await navigator.share({files,title:'VRT Labels'});else downloadAllLabels();}catch(e){if(e.name!=='AbortError')downloadAllLabels()}
}

function getAllLogs(){
  const logs=[];
  assets.forEach(a=>(a.history||[]).forEach(h=>logs.push({date:h.date||'',type:h.type||'edit',code:a.code,name:a.name,zone:a.zone,h})));
  logs.sort((a,b)=>String(b.date||'').localeCompare(String(a.date||'')));
  return logs;
}
function openLog(){document.getElementById('log-q').value='';document.getElementById('log-type').value='';renderLog();openM('m-log');}
function renderLog(){
  const q=(document.getElementById('log-q').value||'').toLowerCase(),ft=document.getElementById('log-type').value;
  let logs=getAllLogs();
  if(ft)logs=logs.filter(l=>l.type===ft);
  if(q)logs=logs.filter(l=>[l.code,l.name,describeHistory(l.h)].some(v=>v&&String(v).toLowerCase().includes(q)));

  el.innerHTML=logs.slice(0,500).map(l=>{const cls=(typeCls[l.type]||'#f1f5f9/#475569').split('/');

      <span style="background:${cls[0]};color:${cls[1]};padding:2px 7px;border-radius:10px;font-size:10px;font-weight:700;white-space:nowrap;flex-shrink:0">${esc(histTypeLabel(l.type))}</span>

function exportExcel(){
  const live=assets.filter(a=>a&&!a._deleted);
  if(!live.length){toast(L('無資料可匯出','No data to export','គ្មានទិន្នន័យសម្រាប់នាំចេញ'),'err');return}
  const cols=[['code',tt('code'),12],['name',tt('name'),25],['category',tt('category'),20],['brand',tt('brand'),12],['model',tt('model'),15],['color',tt('color'),10],['size',tt('size'),12],['qty',tt('qty'),6],['unit',tt('unit'),6],['unitPrice',tt('unitPriceUsd'),12],['zone',tt('zone'),14],['location',tt('location'),18],['user',tt('user'),12],['status',tt('status'),12],['purchaseDate',tt('purchaseDate'),12],['recordedBy',tt('recordedBy'),12],['remark',tt('remark'),20],['history',L('異動記錄','History','ប្រវត្តិ'),60]];
  const val=(a,k)=>k==='category'?catLabel(a.category):k==='zone'?znLabel(a.zone):k==='status'?stLabel(a.status):k==='history'?(a.history||[]).map(h=>`${h.date}: ${describeHistory(h)}`).join(' | ').slice(0,32000):k==='qty'?(+a.qty||1):k==='unitPrice'?(a.unitPrice===''||a.unitPrice==null?'':+a.unitPrice):(a[k]==null?'':a[k]);

// CLEAR ALL DATA（需輸入 CLEAR；留墓碑同步雲端）
// ════════════════════════════════
async function clearAllData(){

}

function saveLocal(){
  try{localStorage.setItem('vrt_a7',JSON.stringify(assets));localStorage.setItem('vrt_c7',JSON.stringify(cnts));localStorage.setItem('vrt_p7',JSON.stringify(pending));localStorage.setItem('vrt_photos',JSON.stringify(photos));}catch(e){toast('❌ '+L('手機儲存空間不足，資料可能未保存','Phone storage is full; data may not be saved','ទំហំផ្ទុកទូរសព្ទពេញ ទិន្នន័យអាចមិនត្រូវបានរក្សាទុក'),'err');}

function loadLocal(){
  try{
    const a=localStorage.getItem('vrt_a7'),p=localStorage.getItem('vrt_p7'),ph=localStorage.getItem('vrt_photos');
    if(a){const list=JSON.parse(a);assets=Array.isArray(list)?list.filter(x=>x&&!x._deleted):[];}
    if(p){const list=JSON.parse(p);pending=Array.isArray(list)?list:[];}
    if(ph){const saved=JSON.parse(ph);if(saved&&typeof saved==='object')photos=saved;}
    assets.forEach(a=>{const p=assetPhotoValue(a.photos);if(p&&a.code&&!photos[a.code])photos[a.code]=p;});
  }catch(e){}

/* 開頁先立即顯示 IndexedDB 快取；共用同步控制器掛載後再於背景比對 manifest／月份桶。 */
function loadAssetCachedThenRefresh(){
  loadLocal();render();setSdot('ok');
  let attempts=0;
  const refresh=function(){
    if(!(window.GC&&GC.sync&&GC.sync.download)){if(attempts++<12)setTimeout(refresh,150);return;}
    /* 有未送出的本機異動時，續傳流程本身會先安全合併雲端；不再平行下載。 */
    if(GC.sync.hasPending&&GC.sync.hasPending('asset'))return;
    GC.sync.download('asset',{silent:true}).then(function(out){
      if(out&&out.unmounted&&attempts++<12)setTimeout(refresh,150);
      else{recomputeCounters();if(!editCode)upCPIfOpen();}
    }).catch(function(e){console.warn('asset background refresh failed',e);});
  };
  setTimeout(refresh,120);
}
function upCPIfOpen(){const fm=document.getElementById('m-form');if(fm&&!fm.classList.contains('hidden'))upCP();}

// ════════════════════════════════

function bootAsset(){

}

          }catch(e){return [];}
